<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - JOGLO WISATA</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top bg-warning">
        <div class="container">
            <a class="navbar-brand text-white fw-bold" href="#beranda">
                JOGLO WISATA
            </a>

            <!-- Tombol Menu Utama (Mobile) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu Links -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link text-white" href="index.html">Beranda</a>
                    <a class="nav-link text-white" href="index.html#tentang">Tentang Kami</a>
                    <a class="nav-link text-white" href="index.html#layanan">Layanan</a>
                    <a class="nav-link text-white" href="index.html#kontak">Kontak</a>
                    <a class="nav-link text-white" href="logout.html">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Section Register -->
    <section class="login-section d-flex align-items-center min-vh-100">
        <div class="container">
            <div class="row justify-content-center align-items-center">

                <!-- Form Register -->
                <div class="col-md-5">
                    <div class="login-card p-4 shadow rounded bg-white">
                        <h3 class="text-center mb-4 text-dark">Register</h3>

                        <form id="formRegister">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" id="username" class="form-control" placeholder="Masukkan username" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" id="email" class="form-control" placeholder="nama@example.com" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
                            </div>

                            <!-- Konfirmasi Password (Opsional tapi disarankan) -->
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Konfirmasi Password</label>
                                <input type="password" id="confirmPassword" class="form-control" placeholder="Ulangi password" required>
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <button type="submit" class="btn btn-primary w-50 me-2">Daftar</button>
                                <button type="reset" class="btn btn-secondary w-50">Batal</button>
                            </div>

                            <p class="text-center mt-3">
                                Sudah punya akun? <a href="login.html" class="text-decoration-none">Login</a>
                            </p>
                            
                            <!-- Social Media Icons -->
                            <div class="text-center mt-4">
                                <a href="#" class="text-dark fs-4 me-3"><i class="bi bi-facebook"></i></a>
                                <a href="#" class="text-info fs-4 me-3"><i class="bi bi-twitter"></i></a>
                                <a href="#" class="text-success fs-4"><i class="bi bi-whatsapp"></i></a>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white py-3 text-center">
        <p class="mb-0">&copy; 2026 TAX & TECH Center</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="js/bootstrap.bundle.min.js"></script>

    <!-- JAVASCRIPT REGISTER -->
    <script>
        document.getElementById("formRegister").onsubmit = function(e) {
            e.preventDefault();

            /* Ambil Nilai Variabel */
            let u = document.getElementById("username").value;
            let em = document.getElementById("email").value;
            let p = document.getElementById("password").value;
            let cp = document.getElementById("confirmPassword").value;

            /* Validasi Input */
            if (p !== cp) {
                alert("Password dan Konfirmasi Password tidak cocok!");
                return;
            }

            if (u.length < 3) {
                alert("Username harus minimal 3 karakter!");
                return;
            }

            /* Simulasi Proses Register (Bisa ditambah dengan LocalStorage atau Ajax) */
            try {
                // Contoh simulasi penyimpanan ke LocalStorage
                localStorage.setItem("user_" + u, JSON.stringify({
                    username: u,
                    email: em,
                    password: p
                }));

                alert("Registrasi Berhasil!\nSilakan Login menggunakan akun baru Anda.");
                window.location.href = "login.html";

            } catch (err) {
                console.error(err);
                alert("Terjadi kesalahan saat menyimpan data.");
            }
        };
    </script>

</body>
</html>
