<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JOGLO WISATA</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top bg-warning">
        <div class="container">
            <a class="navbar-brand text-white fw-bold" href="#beranda">
                JOGLO WISATA
            </a>

            <!-- Tombol Menu Utama (Mobile) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu Links -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link text-white" href="index.html#beranda">Beranda</a>
                    <a class="nav-link text-white" href="index.html#tentang">Tentang Kami</a>
                    <a class="nav-link text-white" href="index.html#layanan">Layanan</a>
                    <a class="nav-link text-white" href="index.html#kontak">Kontak</a>
                    <a class="nav-link text-white" href="logout.html">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Section Login -->
    <section class="login-section d-flex align-items-center min-vh-100">
        <div class="container">
            <div class="row justify-content-center align-items-center">

                <!-- Form Login -->
                <div class="col-md-5">
                    <div class="login-card p-4 shadow rounded bg-white">
                        <h3 class="text-center mb-4 text-dark">Login</h3>

                        <form id="formLogin">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" id="username" class="form-control" placeholder="Masukkan username" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <button type="submit" class="btn btn-primary w-50 me-2">Login</button>
                                <button type="reset" class="btn btn-secondary w-50">Batal</button>
                            </div>

                            <p class="text-center mt-3">
                                Belum punya akun? <a href="register.html" class="text-decoration-none">Buat Akun</a>
                            </p>
                            
                            <!-- Social Media Icons -->
                            <div class="text-center mt-4">
                                <a href="#" class="text-dark fs-4 me-3"><i class="bi bi-facebook"></i></a>
                                <a href="#" class="text-info fs-4 me-3"><i class="bi bi-twitter"></i></a>
                                <a href="#" class="text-success fs-4"><i class="bi bi-whatsapp"></i></a>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white py-3 text-center">
        <p class="mb-0">&copy; JOGLO WISATA</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="js/bootstrap.bundle.min.js"></script>

    <!-- JAVASCRIPT LOGIN -->
    <script>
        document.getElementById("formLogin").onsubmit = function(e) {
            e.preventDefault();

            /* Ambil Nilai Variabel */
            let u = document.getElementById("username").value;
            let p = document.getElementById("password").value;

            /* Ambil data user dari LocalStorage */
            let userData = localStorage.getItem("user_" + u);

            if (userData) {
                // Konversi JSON ke object
                let data = JSON.parse(userData);

                /* Cek password */
                if (data.password === p) {
                    alert("Login Berhasil!\nSelamat Datang, " + data.username);
                    window.location.href = "user.html";
                } else {
                    alert("Password salah!");
                }
            } else {
                /* Jika username tidak ditemukan */
                alert("Username tidak ditemukan!\nSilakan melakukan registrasi terlebih dahulu.");
            }
        };
    </script>

</body>
</html>
